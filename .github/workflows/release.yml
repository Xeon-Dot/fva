name: Release

on:
  release:
    types: [prereleased]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: on

jobs:
  build:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-musl
            artifact_name: fva-linux-amd64
            archive_ext: tar.gz
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-musl
            artifact_name: fva-linux-arm64
            archive_ext: tar.gz
          - os: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            artifact_name: fva-windows-amd64
            archive_ext: zip
          - os: blacksmith-6vcpu-macos-latest
            target: aarch64-apple-darwin
            artifact_name: fva-macos-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install sccache
        run: cargo binstall sccache

      - name: Configure sccache
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install protobuf-compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protobuf-compiler (macos)
        if: contains(matrix.target, 'apple-darwin')
        run: brew install protobuf

      - name: Install protobuf-compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Build
        run: cargo build --release --all-features --target ${{ matrix.target }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar czf "dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" \
            -C "target/${{ matrix.target }}/release" fva

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/fva.exe" -DestinationPath "dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum fva-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*

      - name: Promote to latest release
        run: gh release edit "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --prerelease=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
